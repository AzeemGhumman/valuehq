[project]
name = "valuehq-workers"
version = "0.1.0"
description = "ValueHQ background workers: website ingestion and research jobs. Deployed separately from the web app."
requires-python = ">=3.12"
dependencies = [
  "scrapy>=2.11,<3",            # crawler: rules, depth, retries, throttling, robots.txt
  "scrapy-playwright>=0.0.41",  # optional JavaScript rendering through a headless browser
  "playwright==1.49.1",         # must match the browser build in the Docker base image
  "trafilatura>=1.12",          # main-content extraction: HTML -> clean markdown
  "boto3>=1.35",
  "anthropic>=0.40",
]

[project.scripts]
valuehq-workers = "valuehq_workers.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["valuehq_workers*"]

[tool.setuptools.package-data]
"valuehq_workers.analyze" = ["prompts/*.md"]
