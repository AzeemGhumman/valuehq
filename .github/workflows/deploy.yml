# Deploys automatically:
#   push to main          -> dev  (stack valuehq-dev)
#   push a tag v*         -> prod (stack valuehq-prod; waits for approval if the "prod" environment requires reviewers)
#   Actions tab > Run workflow -> either, by hand
# Skipped until the repo variable AWS_DEPLOY_ROLE_ARN is set (see README "Set up auto-deploy").
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ['workers/**', 'infra/workers.yaml', 'scripts/deploy-workers.sh', '.github/workflows/deploy-workers.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # lets the job get temporary AWS credentials through OIDC
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy ${{ env.TARGET }}
        run: bash scripts/deploy.sh "$TARGET"
