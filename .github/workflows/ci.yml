# Checks every pull request: the app (type-check, build, SAM template) and the workers (tests, image, template). Deploys nothing.
name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build:lambda
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate template
        run: sam validate --lint --region us-east-1

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: cd workers && python -m unittest discover -s tests
      - name: Lint the workers template
        run: pip install cfn-lint && cfn-lint infra/workers.yaml
      - name: Build the worker image (installs dependencies and runs the tests inside it)
        run: docker build --platform linux/amd64 -t valuehq-workers:ci workers
