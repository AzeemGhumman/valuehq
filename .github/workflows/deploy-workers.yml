# Deploys the background workers (stack valuehq-workers-<env>) on their own, only when they change:
#   push to main touching workers/ or infra/workers.yaml -> dev
#   push a tag v*                                        -> prod (waits for approval like the app)
#   Actions tab > Run workflow                           -> either, by hand
# Skipped until the repo variable AWS_DEPLOY_ROLE_ARN is set (see README "Set up auto-deploy").
name: Deploy workers
on:
  push:
    branches: [main]
    paths: ['workers/**', 'infra/workers.yaml', 'scripts/deploy-workers.sh', 'scripts/aws-account.sh', 'config/account.ts', '.github/workflows/deploy-workers.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
    concurrency:
      group: deploy-workers-${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: cd workers && python -m unittest discover -s tests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy workers ${{ env.TARGET }}
        run: bash scripts/deploy-workers.sh "$TARGET"
